# Google Fonts build of Admiralty Serif:  cd sources && gftools builder config-serif.yaml
# The UFO masters in this folder are written by scripts/build_fonts.py. Run that first
# after any change to the scripts.
sources:
  - AdmiraltySerif.designspace
  - AdmiraltySerif-Italic.designspace
familyName: Admiralty Serif
outputDir: ../build/gf/serif
buildVariable: true
buildStatic: true
buildOTF: false
buildWebfont: true
