# Google Fonts build of Admiralty Mono:  cd sources && gftools builder config-mono.yaml
# The UFO masters in this folder are written by scripts/build_fonts.py. Run that first
# after any change to the scripts.
sources:
  - AdmiraltyMono.designspace
  - AdmiraltyMono-Italic.designspace
familyName: Admiralty Mono
outputDir: ../build/gf/mono
buildVariable: true
buildStatic: true
buildOTF: false
buildWebfont: true
