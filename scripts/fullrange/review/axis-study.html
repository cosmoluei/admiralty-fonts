<script>
const axes=['wght','wdth','RADI'];
function redraw(){
  const values=axes.map(id=>document.getElementById(id).value);
  for(const [i,id] of ['weight','width','radius'].entries()) document.getElementById(id).value=values[i]+(i?'%':'');
  const setting=axes.map((id,i)=>'"'+id+'" '+values[i]).join(', ');
  document.querySelectorAll(".sample").forEach(el=>el.style.fontVariationSettings=setting);
}
document.querySelectorAll('input').forEach(input=>input.addEventListener('input',redraw));redraw();
</script>
